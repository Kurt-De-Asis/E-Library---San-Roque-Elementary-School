services:
  - type: web
    name: elibrary
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_HOST
        fromService:
          type: pserv
          name: mysql
          property: host
      - key: DB_USER
        fromService:
          type: pserv
          name: mysql
          property: user
      - key: DB_PASS
        fromService:
          type: pserv
          name: mysql
          property: password
      - key: DB_NAME
        value: elibrary_db
      - key: SITE_NAME
        value: San Roque Elementary School E-Library
    disk:
      name: uploads
      mountPath: /var/www/html/uploads
      sizeGB: 1

  - type: pserv
    name: mysql
    plan: free
    env: mysql
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
      - key: MYSQL_DATABASE
        value: elibrary_db
      - key: MYSQL_USER
        generateValue: true
      - key: MYSQL_PASSWORD
        generateValue: true
